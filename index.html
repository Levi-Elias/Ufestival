<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>U Festival</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#F03228">
    <link rel="apple-touch-icon" href="./assets/logob.png">
    <link rel="icon" href="./assets/logo_white.svg" type="image/svg+xml">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-logo">
            <img id="header-logo-img" src="./assets/logo_white.svg" alt="U Festival Logo">
            <span class="header-title">FESTIVAL</span>
        </div>
        <div class="header-controls">
            <button id="install-btn" class="control-btn" aria-label="Install App" style="display: none;" title="Install App">📱</button>
            <button id="theme-toggle" class="control-btn" aria-label="Toggle dark mode">🌙</button>
            <button id="lang-toggle" class="control-btn" aria-label="Toggle language">🇳🇱</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
        
        <!-- HOME SECTION (Phase 2) -->
        <section id="home" class="page-section active">
            <div class="hero">
                <h1 data-i18n="home_welcome">WELKOM BIJ U FESTIVAL</h1>
                <p data-i18n="home_subtitle" class="italic-text">Beleef de ultieme festival ervaring.</p>
            </div>
            
            <!-- News Block: Today's Acts -->
            <div class="news-block" id="news-block">
                <div class="news-header">
                    <span class="news-icon">🎵</span>
                    <span class="news-title" data-i18n="news_today">Vandaag op het podium</span>
                    <span class="news-progress-bar"><span id="news-progress-fill"></span></span>
                </div>
                <div class="news-slider-wrapper">
                    <div class="news-slide" id="news-slide-content">
                        <!-- Filled by news.js -->
                    </div>
                </div>
                <div class="news-dots" id="news-dots"></div>
            </div>

            <div class="stages-grid">
                <div class="stage-card">
                    <img src="./assets/ponton.png" alt="Ponton Stage">
                    <div class="stage-name" data-i18n="stage_ponton">Ponton</div>
                </div>
                <div class="stage-card">
                    <img src="./assets/thelake.png" alt="The Lake Stage">
                    <div class="stage-name" data-i18n="stage_lake">The Lake</div>
                </div>
                <div class="stage-card">
                    <img src="./assets/theclub.png" alt="The Club Stage">
                    <div class="stage-name" data-i18n="stage_club">The Club</div>
                </div>
                <div class="stage-card">
                    <img src="./assets/hangar.png" alt="Hangar Stage">
                    <div class="stage-name" data-i18n="stage_hangar">Hangar</div>
                </div>
            </div>
        </section>

        <!-- INFO SECTION (Phase 3) -->
        <section id="info" class="page-section">
            <h1 data-i18n="nav_info">FESTIVAL INFORMATION</h1>
            <div id="info-accordion-container">
                <!-- Accordions will be rendered here by info.js -->
            </div>
        </section>

        <!-- LINEUP SECTION (Phase 4) -->
        <section id="lineup" class="page-section">
            <h1 data-i18n="nav_lineup">LINE-UP SCHEDULE</h1>
            
            <div class="day-tabs">
                <button id="tab-saturday" class="day-tab active" data-i18n="tab_saturday">Zaterdag</button>
                <button id="tab-sunday" class="day-tab" data-i18n="tab_sunday">Zondag</button>
            </div>
            
            <div id="schedule-grid" class="schedule-grid">
                <!-- Acts will be rendered here -->
            </div>
        </section>

        <!-- MAP SECTION (Phase 5) -->
        <section id="map" class="page-section">
            <h1 data-i18n="nav_map">FESTIVAL MAP</h1>
            <div class="map-viewport" id="map-viewport">
                <div class="map-transform-container" id="map-transform-container">
                    <div id="map-image-wrapper" style="position: relative; display: inline-block; aspect-ratio: 2330.58/1353.19; width: auto; height: 100%;">
                        <img src="./assets/markers/kaart_festival_markers.svg" alt="Festival Map" id="festival-map-img" style="display: block; width: 100%; height: 100%;">
                        
                        <!-- Map Hotspots for Stages -->
                        <button class="map-hotspot" data-stage="ponton" style="left: 21.32%; top: 62.75%; position: absolute; width: 8%; aspect-ratio: 1; background: rgba(0,0,0,0); border: none; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; z-index: 5;"></button>
                        <button class="map-hotspot" data-stage="lake" style="left: 53.93%; top: 45.47%; position: absolute; width: 8%; aspect-ratio: 1; background: rgba(0,0,0,0); border: none; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; z-index: 5;"></button>
                        <button class="map-hotspot" data-stage="club" style="left: 69.27%; top: 39.07%; position: absolute; width: 8%; aspect-ratio: 1; background: rgba(0,0,0,0); border: none; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; z-index: 5;"></button>
                        <button class="map-hotspot" data-stage="hangar" style="left: 90.20%; top: 17.08%; position: absolute; width: 8%; aspect-ratio: 1; background: rgba(0,0,0,0); border: none; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; z-index: 5;"></button>
                    </div>
                    <div id="gps-dot" class="gps-dot"></div>
                </div>
                <div class="map-overlay-controls">
                    <button id="gps-btn" class="map-control-btn" aria-label="Locate me">📍</button>
                    <div class="zoom-controls">
                        <button id="zoom-in-btn" class="map-control-btn">+</button>
                        <button id="zoom-out-btn" class="map-control-btn">-</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Artist Modal (Phase 4) -->
    <div id="artist-modal" class="modal-overlay">
        <div class="modal-content">
            <button id="modal-close" class="modal-close-btn">&times;</button>
            <div class="modal-image-container" id="modal-image-container">
                <!-- Image or video iframe will be injected here -->
            </div>
            <div class="modal-body">
                <h2 id="modal-name" class="modal-name"></h2>
                <button id="modal-fav-btn" class="modal-fav-btn"></button>
                <p id="modal-stage-time" class="modal-stage-time italic-text"></p>
                <p id="modal-desc" class="modal-desc"></p>
            </div>
        </div>
    </div>

    <!-- Stage Modal -->
    <div id="stage-modal" class="modal-overlay">
        <div class="modal-content" style="max-height: 90vh; display: flex; flex-direction: column; width: 95%; max-width: 500px;">
            <button id="stage-modal-close" class="modal-close-btn">&times;</button>
            <div class="modal-image-container" id="stage-modal-image-container" style="height: 200px;">
                <!-- Image injected via JS -->
            </div>
            <div class="modal-body" style="overflow-y: auto; flex: 1; padding: 20px;">
                <h2 id="stage-modal-name" class="modal-name" style="margin-bottom: 5px; color: var(--color-secondary);"></h2>
                <div id="stage-modal-acts" class="stage-acts-list" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
                    <!-- Acts will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Install Modal -->
    <div id="install-modal" class="modal-overlay">
        <div class="modal-content install-modal-content">
            <button id="install-modal-close" class="modal-close-btn">&times;</button>
            <div class="modal-body" style="text-align: center;">
                <h2 class="modal-name" data-i18n="install_title">App Installeren</h2>
                <p class="modal-desc" data-i18n="install_desc" style="margin-bottom: 15px;">Wil je de U Festival app installeren op je apparaat voor een betere ervaring en offline toegang?</p>
                <div style="margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <input type="checkbox" id="install-never-ask" style="cursor: pointer;">
                    <label for="install-never-ask" data-i18n="install_never_ask" style="font-size: 0.9rem; cursor: pointer; color: var(--text-color); opacity: 0.8;">Niet nog een keer vragen</label>
                </div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="install-modal-btn" class="modal-fav-btn" data-i18n="install_btn" style="background-color: var(--color-accent); color: white; border: none; font-weight: bold; margin-bottom: 0;">Installeren</button>
                    <button id="install-modal-cancel" class="modal-fav-btn" data-i18n="install_later" style="margin-bottom: 0;">Later</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="home">
            <span class="nav-icon">🏠</span>
            <span data-i18n="nav_home">Home</span>
        </button>
        <button class="nav-item" data-target="info">
            <span class="nav-icon">ℹ️</span>
            <span data-i18n="nav_info">Info</span>
        </button>
        <button class="nav-item" data-target="lineup">
            <span class="nav-icon">🎵</span>
            <span data-i18n="nav_lineup">Lineup</span>
        </button>
        <button class="nav-item" data-target="map">
            <span class="nav-icon">📍</span>
            <span data-i18n="nav_map">Kaart</span>
        </button>
    </nav>

    <!-- Scripts -->
    <script src="./js/i18n.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/info.js"></script>
    <script src="./js/lineup.js"></script>
    <script src="./js/news.js"></script>
    <script src="./js/map.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
